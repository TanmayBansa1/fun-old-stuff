<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .container {
        background-color: bisque;
        height: 100vh;
        width: 100vw;
        box-sizing: border-box;
        border: 3px solid brown;
      }
      #rectangle1{
        height: 100px;
        width: 100%;
        background-color: black;
        position: relative;
        top: 0;
        /* box-sizing: border-box; */
        transition: all 5s 2s;
      }
      #rectangle1:hover{
        width: 500px;
        height: 500px;
      }
      #rectangle2{
        height: 100px;
        width: 100%;
        background-color: black;
        position: relative;
        /* box-sizing: border-box; */
        top: 525px;
        transform: translate(200px), rotate(45deg);
      }
      #box1{
        position: fixed;
        top: 3px;
        left: 0;
        height: 100px;
        width: 80px;
        background-color: brown;
        animation: 10s ease-in 1s infinite alternate-reverse none running slidein1;
      }
      #box2{
        position: fixed;
        top: 627px;
        left: 1455px;
        height: 100px;
        width: 80px;
        background-color: blue;
        animation: 10s ease-in 1s infinite alternate-reverse both running slidein2;
      }
      #box3{
        position: fixed;
        top: 627px;
        left: 0;
        height: 100px;
        width: 80px;
        background-color: rgb(124, 165, 42);
        animation: 10s ease-in 1s infinite alternate-reverse both running slidein3;
      }
      #box4{
        position: fixed;
        top: 3px;
        left: 1455px;
        height: 100px;
        width: 80px;
        background-color: pink;
        animation: 10s ease-in 1s infinite alternate-reverse both running slidein4;
      }
      @keyframes slidein1 {
        from{
            top: 3px;
            left: 0px;
        }
        to{
            top: 3px;
            left: 1455px;
        }            
      }
      @keyframes slidein2 {
        from{
            top: 627px;
            left: 1455px;
        }
        to{
            top: 627px;
            left: 0;
        }
        
      }
      @keyframes slidein3 {
        from{
            top: 627px;
            left: 0px;
        }
        to{
            top: 627px;
            left: 1455px;
        }

        
      }
      @keyframes slidein4 {
        from{
            top: 3px;
            left: 1455px;

        }
        to{
            top: 3px;
            left: 0;
        }
        
      }
      .square{
        height: 200px;
        width: 200px;
        transform: rotate(45deg);
        background-color: aqua;
      }
        
      
    </style>
  </head>
  <body>
    <div class="container">
      
        <div id="rectangle1"></div>
        <div id="rectangle2"></div>
        <div class="square"> I am a squARE NIGGAAAAA</div>
      
        <div id="box1"></div>
        <div id="box2"></div>
        <div id="box3"></div>
        <div id="box4"></div>
      
    </div>
  </body>
</html>
